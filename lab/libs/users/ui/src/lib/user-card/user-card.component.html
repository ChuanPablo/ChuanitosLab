<mat-card class="user-card" [class.inactive]="user.status === 'inactive'">
  <mat-card-header>
    <!-- Avatar -->
    <lib-shared-ui-avatar
      mat-card-avatar
      [user]="user"
      [size]="AvatarSize.Small"
    ></lib-shared-ui-avatar>
    <!-- User Info -->
    <mat-card-title class="user-name">
      <a [routerLink]="`/u/${user.id}/`" (click)="$event.stopPropagation()">{{ this.getFullName() }}</a>
    </mat-card-title>
    <mat-card-subtitle class="user-email">&commat;{{ user.username }}</mat-card-subtitle>

    <!-- Actions Menu -->
    <div class="card-actions" *ngIf="showActions">
      <button mat-icon-button
              [matMenuTriggerFor]="userMenu"
              aria-label="User actions">
        <mat-icon>more_vert</mat-icon>
      </button>

      <mat-menu #userMenu="matMenu">
        <button mat-menu-item (click)="onViewDetails($event)">
          <mat-icon>visibility</mat-icon>
          <span>View Details</span>
        </button>
        <button mat-menu-item (click)="onEdit($event)" *ngIf="canEditUser(user.id)">
          <mat-icon>edit</mat-icon>
          <span>Edit</span>
        </button>
        <button mat-menu-item (click)="onToggleStatus($event)" *ngIf="canEditUser(user.id)">
          <mat-icon>{{ user.status === 'active' ? 'block' : 'check_circle' }}</mat-icon>
          <span>{{ user.status === 'active' ? 'Deactivate' : 'Activate' }}</span>
        </button>
        <button mat-menu-item (click)="onDelete($event)" class="delete-action" *ngIf="canEditUser(user.id)">
          <mat-icon>delete</mat-icon>
          <span>Delete</span>
        </button>
      </mat-menu>
    </div>
  </mat-card-header>

  <mat-card-content>
    <!-- Status Chip -->
    <div class="status-section">
      <mat-chip-set>
        <mat-chip [color]="getStatusColor(user.status)" selected>
          <mat-icon matChipAvatar>
            {{ user.status === 'active' ? 'check_circle' :
            user.status === 'inactive' ? 'block' : 'schedule' }}
          </mat-icon>
          {{ user.status | titlecase }}
        </mat-chip>
      </mat-chip-set>
    </div>

    <!-- Activity Info -->
    <div class="activity-info">
      <div class="activity-row" *ngIf="user.lastActive">
        <span class="activity-label">Last active:</span>
        <span class="activity-value">{{ getRelativeTime(user.lastActive) }}</span>
      </div>

      <div class="activity-row">
        <span class="activity-label">Joined:</span>
        <span class="activity-value">{{ getRelativeTime(user.joinDate) }}</span>
      </div>
    </div>
  </mat-card-content>

  <mat-card-actions *ngIf="showActions" class="card-footer-actions">
    <button mat-button (click)="onViewDetails($event)">
      <mat-icon>visibility</mat-icon>
      View
    </button>
    <button *ngIf="canEditUser(user.id)" mat-button (click)="onEdit($event)">
      <mat-icon>edit</mat-icon>
      Edit
    </button>
  </mat-card-actions>
</mat-card>
