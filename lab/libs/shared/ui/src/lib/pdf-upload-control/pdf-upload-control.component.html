<div class="pdf-upload-field">
  <label class="field-label">{{ label }}</label>

  <div class="upload-container">
    <!-- Display selected file or upload prompt -->
    <div *ngIf="!selectedFile"
         class="upload-prompt"
         [class.drag-over]="isDragOver"
         tabindex="0"
         role="button"
         [attr.aria-label]="'Click to select PDF file or drag and drop'"
         (dragover)="onDragOver($event)"
         (dragleave)="onDragLeave($event)"
         (drop)="onDrop($event)"
         (click)="fileInput.click()"
         (keydown)="onKeyDown($event)">
      <mat-icon>cloud_upload</mat-icon>
      <span>Click to select PDF or drag & drop</span>
    </div>

    <!-- Display selected file info -->
    <div *ngIf="selectedFile" class="selected-file">
      <mat-icon color="primary">picture_as_pdf</mat-icon>
      <div class="file-details">
        <span class="filename">{{ selectedFile.name }}</span>
        <span class="filesize">{{ formatFileSize(selectedFile.size) }}</span>
      </div>
      <button
        type="button"
        mat-icon-button
        color="warn"
        (click)="clearFile()"
        matTooltip="Remove file">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </div>

  <!-- Hidden file input -->
  <input
    #fileInput
    type="file"
    accept=".pdf"
    (change)="onFileSelected($event)"
    style="display: none;">

  <!-- Error display -->
  <div *ngIf="errorMessage" class="error-message">
    <mat-icon color="warn">error</mat-icon>
    {{ errorMessage }}
  </div>

  <!-- Helper text -->
  <div *ngIf="!selectedFile && hint && !errorMessage" class="hint-text">
    {{ hint }}
  </div>
</div>
