<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header class="login-header">
      <mat-card-title>
        <mat-icon class="login-icon">account_circle</mat-icon>
        Sign In
      </mat-card-title>
      <mat-card-subtitle>Welcome back! Please sign in to continue.</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="login-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput
                 type="email"
                 formControlName="email"
                 placeholder="Enter your email">
          <mat-icon matSuffix>email</mat-icon>
          <mat-error>{{ getEmailErrorMessage() }}</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput
                 [type]="hidePassword ? 'password' : 'text'"
                 formControlName="password"
                 placeholder="Enter your password">
          <button mat-icon-button
                  matSuffix
                  (click)="hidePassword = !hidePassword"
                  type="button"
                  [attr.aria-label]="'Hide password'"
                  [attr.aria-pressed]="hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error>{{ getPasswordErrorMessage() }}</mat-error>
        </mat-form-field>
        <div class="form-options">
          <mat-checkbox formControlName="rememberMe">Remember me</mat-checkbox>
          <a href="#" class="forgot-password">Forgot password?</a>
        </div>
        <lib-shared-ui-raised-spinner-button class="login-button full-width"
                              [isLoading]="isLoading"
                              type="submit">
          <span>Sign In</span>
          <span loading>Signing In...</span>
        </lib-shared-ui-raised-spinner-button>
      </form>
    </mat-card-content>

    <mat-card-actions class="login-actions">
      <p class="signup-text">
        Don't have an account?
        <a href="#" class="signup-link" (click)="onSignup($event)">Sign up here</a>
      </p>
    </mat-card-actions>
  </mat-card>
</div>
