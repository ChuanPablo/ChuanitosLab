<mat-toolbar color="primary" class="navbar-toolbar">
  <div class="navbar-container">
    <!-- Logo/Brand -->
    <div class="navbar-brand">
      <a routerLink="/" mat-button class="brand-button">
        <mat-icon>home</mat-icon>
        <span class="brand-text">{{ appName() || 'YourApp' }}</span>
      </a>
    </div>

    <!-- Search Bar (Desktop) -->
    <lib-shared-ui-search-bar class="search-bar"
                              *ngIf="!isMobile()"
                              (searchSubmitted)="onSearchSubmitted($event)"
                              (searchIconClicked)="onSearchIconClicked($event)"
                              (suggestionSelected)="onSuggestionSelected($event)"
    >
      Search by name or username
    </lib-shared-ui-search-bar>
    <!-- Desktop Navigation -->
    <div class="navbar-nav" *ngIf="!isMobile()">
      <a [routerLink]="`/${BaseRoutes.Dashboard}`"
         routerLinkActive="active-link"
         mat-button>
        Dashboard
      </a>
      <a [routerLink]="`/${BaseRoutes.About}`"
         routerLinkActive="active-link"
         mat-button>
        About
      </a>
    </div>

    <!-- Desktop Actions -->
    <div class="navbar-actions" *ngIf="!isMobile()">
      <ng-container *ngIf="isLoggedIn(); else signInButton">
        <button mat-button [matMenuTriggerFor]="userMenu">
          <mat-icon>account_circle</mat-icon>
          <span>Profile</span>
        </button>
        <mat-menu #userMenu="matMenu">
          <button mat-menu-item [routerLink]="`/${BaseRoutes.User}/${currentUserId()}`">
            <mat-icon>person</mat-icon>
            <span>My Profile</span>
          </button>
          <button mat-menu-item routerLink="/settings">
            <mat-icon>settings</mat-icon>
            <span>Settings</span>
          </button>
          <mat-divider></mat-divider>
          <button mat-menu-item (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Sign Out</span>
          </button>
        </mat-menu>
      </ng-container>
      <ng-template #signInButton>
        <button mat-button routerLink="/login">
          <mat-icon>login</mat-icon>
          <span>Sign In</span>
        </button>
      </ng-template>
    </div>

    <!-- Mobile Menu Button -->
    <button
      *ngIf="isMobile()"
      mat-icon-button
      (click)="toggleMobileMenu()"
      aria-label="Toggle navigation menu"
    >
      <mat-icon>{{ isMobileMenuOpen() ? 'close' : 'menu' }}</mat-icon>
    </button>
  </div>
</mat-toolbar>

<!-- Mobile Side Navigation -->
<div class="mobile-menu-overlay" 
     *ngIf="isMobile() && isMobileMenuOpen()"
     (click)="closeMobileMenu()">
</div>

<div class="mobile-menu" 
     *ngIf="isMobile()" 
     [class.open]="isMobileMenuOpen()">
  <div class="mobile-menu-content">
    <!-- Mobile Search -->
    <div class="mobile-search">
      <lib-shared-ui-search-bar compact
                                (searchSubmitted)="onSearchSubmitted($event)"
                                (searchIconClicked)="onSearchIconClicked($event)"
                                (suggestionSelected)="onSuggestionSelected($event)"
                                class="search-bar-mobile">
        Search by name or username
      </lib-shared-ui-search-bar>
    </div>
    
    <!-- Navigation Links -->
    <div class="mobile-nav-links">
      <a [routerLink]="`/${BaseRoutes.User}`"
         routerLinkActive="active-mobile-link"
         (click)="closeMobileMenu()"
         class="mobile-nav-link">
        <mat-icon>people</mat-icon>
        <span>Users</span>
      </a>

      <a routerLink="/about"
         routerLinkActive="active-mobile-link"
         (click)="closeMobileMenu()"
         class="mobile-nav-link">
        <mat-icon>info</mat-icon>
        <span>About</span>
      </a>
    </div>

    <!-- Mobile Actions -->
    <div class="mobile-actions" *ngIf="isLoggedIn()">
      <button mat-raised-button color="accent" class="mobile-action-btn" (click)="logout()">
        Sign Out
      </button>
    </div>
    <div class="mobile-actions" *ngIf="!isLoggedIn()">
      <button mat-stroked-button class="mobile-action-btn" routerLink="/login" (click)="closeMobileMenu()">
        Sign In
      </button>
      <button mat-raised-button color="accent" class="mobile-action-btn" routerLink="/register" (click)="closeMobileMenu()">
        Sign Up
      </button>
    </div>
  </div>
</div>
