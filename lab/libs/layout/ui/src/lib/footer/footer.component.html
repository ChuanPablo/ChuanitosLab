<footer class="footer">
  <mat-toolbar class="footer-toolbar">
    <div class="footer-container">

      <!-- Copyright Section -->
      <div class="footer-section">
        <span class="copyright">
          © {{ currentYear }} Chuanito's Lab. All rights reserved.
        </span>
      </div>

      <!-- Powered By Section -->
      <div class="footer-section powered-by">
        <span class="powered-text">Powered by</span>

        <div class="logo-container">
          <!-- Angular Logo -->
          <a href="https://angular.io"
             target="_blank"
             mat-button
             class="logo-button"
             aria-label="Built with Angular">
            <img src="img/logo/angular.svg"
                 alt="Angular"
                 class="tech-logo angular-logo">
          </a>

          <mat-divider [vertical]="true" class="logo-divider"></mat-divider>

          <!-- JetBrains Logo -->
          <a href="https://www.djangoproject.com/"
             target="_blank"
             mat-button
             class="logo-button"
             aria-label="Developed with JetBrains tools">
            <img src="img/logo/django.svg"
                 alt="Django Framework"
                 class="tech-logo jetbrains-logo">
          </a>

          <mat-divider [vertical]="true" class="logo-divider"></mat-divider>

          <!-- JetBrains Logo -->
          <a href="https://www.jetbrains.com"
             target="_blank"
             mat-button
             class="logo-button"
             aria-label="Developed with JetBrains tools">
            <img src="img/logo/jetbrains.svg"
                 alt="JetBrains"
                 class="tech-logo jetbrains-logo">
          </a>

          <mat-divider [vertical]="true" class="logo-divider"></mat-divider>

          <!-- Docker Logo -->
          <a href="https://www.docker.com"
             target="_blank"
             mat-button
             class="logo-button"
             aria-label="Containerized with Docker">
            <img src="img/logo/docker.svg"
                 alt="Docker"
                 class="tech-logo docker-logo">
          </a>

          <mat-divider [vertical]="true" class="logo-divider"></mat-divider>

          <!-- TrueNAS Logo -->
          <a href="https://www.truenas.com"
             target="_blank"
             mat-button
             class="logo-button"
             aria-label="Hosted on TrueNAS">
            <img src="img/logo/truenas.svg"
                 alt="TrueNAS"
                 class="tech-logo truenas-logo">
          </a>
        </div>
      </div>

      <!-- Social/Links Section (optional) -->
      <div class="footer-section social-links">
        <a href="https://github.com"
           target="_blank"
           mat-icon-button
           aria-label="GitHub">
          <mat-icon>code</mat-icon>
        </a>

        <a href="mailto:contact@chuanitoslab.com"
           mat-icon-button
           aria-label="Contact">
          <mat-icon>email</mat-icon>
        </a>
      </div>

    </div>
  </mat-toolbar>
</footer>
